<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HerbaDry Monitoring</title>

    <link rel="stylesheet" href="style.css" />

    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>

  <body>
    <div class="topbar">
      <div class="brand">
        <i class="fas fa-seedling"></i>
        <div>
          <span>HerbaDry Monitoring</span>
        </div>
      </div>

      <div class="top-right">
        <div class="clock" id="clock">00:00:00</div>

        <div class="esp-status esp-offline" id="espStatus">ESP32 Offline</div>

        <div class="wifi-icon wifi-offline" id="wifiIcon">
          <i class="bi bi-wifi"></i>
        </div>
      </div>
    </div>

    <div class="container">
      <div id="notif" class="notif aman">Menunggu data...</div>

      <div class="grid">
        <div class="card">
          <i class="fas fa-temperature-high card-icon"></i>
          <h3>Suhu</h3>
          <p id="suhu">--</p>
        </div>

        <div class="card">
          <i class="fas fa-water card-icon"></i>
          <h3>Kelembapan</h3>
          <p id="kelembapan">--</p>
        </div>

        <div class="card">
          <i class="fas fa-seedling card-icon"></i>
          <h3>Moisture</h3>
          <p id="soil">--</p>
        </div>

        <div class="card">
          <i class="fas fa-clock card-icon"></i>
          <h3>Durasi Pengeringan</h3>
          <p id="duration">00h 00m</p>
        </div>

        <div class="card status-card">
          <i class="fas fa-heartbeat card-icon"></i>
          <h3>Status Sistem</h3>
          <p id="status">--</p>
        </div>
      </div>

      <div class="card control">
        <i class="fas fa-sliders-h card-icon"></i>

        <h3>Control Panel</h3>

        <div class="control-buttons">
          <div class="start-stop-group">
            <button class="btn-start" onclick="mulaiPengeringan()">
              <i class="fas fa-play"></i>
              Mulai
            </button>

            <button class="btn-stop" onclick="stopPengeringan()">
              <i class="fas fa-stop"></i>
              Stop
            </button>
          </div>

          <button class="btn-alarm" onclick="matikanBuzzer()">
            <i class="fas fa-bell-slash"></i>
            Matikan Alarm
          </button>
        </div>

        <p id="buzzerStatus">Alarm: ON</p>
      </div>
    </div>

    <div id="popup" class="popup hidden">
      <div class="popup-box">
        <h2 id="popupText">ALERT</h2>

        <button onclick="matikanBuzzer()">OFF Alarm</button>
      </div>
    </div>

    <script type="module" src="app.js"></script>
  </body>
</html>
