<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Smart Monitoring</title>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>

<body>

  <!-- ================= HEADER FINAL ================= -->
  <div class="topbar">

    <div class="brand">
      <i class="fas fa-seedling"></i>
      <span>Smart Monitoring</span>
    </div>

    <div class="top-right">

      <!-- Jam -->
      <div class="clock" id="clock">00:00:00</div>

      <!-- Status ESP32 -->
      <div class="esp-status" id="espStatus">
        ESP32 Offline
      </div>

      <!-- WiFi -->
      <div class="wifi-icon wifi-offline" id="wifiIcon" title="Status WiFi">
        <i class="bi bi-wifi"></i>
      </div>

    </div>

  </div>

  <div class="container">

    <div id="notif" class="notif aman">Menunggu data...</div>

    <div class="grid">

      <div class="card">
        <h3>Suhu</h3>
        <p id="suhu">--</p>
      </div>

      <div class="card">
        <h3>Kelembapan</h3>
        <p id="kelembapan">--</p>
      </div>

      <div class="card">
        <h3>Moisture</h3>
        <p id="soil">--</p>
      </div>

      <div class="card">
        <h3>Status</h3>
        <p id="status">--</p>
      </div>

    </div>

    <div class="card control">
      <i class="fas fa-bell"></i>
      <h3>Alarm Control</h3>

      <button onclick="matikanBuzzer()">Matikan Alarm</button>

      <p id="buzzerStatus">Alarm: ON</p>

    </div>

  </div>

  <!-- popup -->
  <div id="popup" class="popup hidden">
    <div class="popup-box">
      <h2 id="popupText">ALERT</h2>
      <button onclick="matikanBuzzer()">OFF Alarm</button>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>

</html>
